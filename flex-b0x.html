<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>flex box demo</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        h1{
            text-align: center;
            color: darkcyan;
        }
        .container{
            height: 400px;
            border: 2px solid black;
            background-color: lightseagreen;
            border-radius: 2px;
            display: flex;
            flex-direction: row;
            justify-content:space-evenly;
            align-items: center;

        }
        .box{
            border: 1px soloid black;
            background-color:green ;
            color: white;
            width: 100px;
            text-align: center;
            padding: 20px;
            cursor: pointer;;
        }
    </style>
</head>
<body>
    <h1>flex box demo</h1>
<div class="container">
    <div class="box">box 1</div>
     <div class="box">box 2</div>
      <div class="box">box 3</div>
       <div class="box">box 4</div>
</div>
</body>
</html>
