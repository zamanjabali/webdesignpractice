<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>flex box advance properties</title>
    <style>
          .container{
            height: 400px;
            border: 2px solid black;
            background-color: lightseagreen;
            border-radius: 2px;
            display: flex;
            flex-direction: row;
            justify-content:space-evenly;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;

        }
         .box{
            border: 1px soloid black;
            background-color:green ;
            color: white;
            width: 100px;
            text-align: center;
            padding: 20px;
            cursor: pointer;;
        }
        .box1{
            background-color: lightsalmon;
            flex: 1 1 100px;
        }
          .box2{
            background-color: rgb(255, 241, 112);
            flex: 3 0 300px;
        }
         .box3{
            background-color: lightpink;
            flex: 1 1 200px;
        
        }
        h1{
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
     
        
    </style>
</head>
<body>
        <h1>flex box demo</h1>
<div class="container">
    <div class="box box1">box 1</div>
     <div class="box box2">box 2</div>
      <div class="box box3">box 3</div>
</div>
</body>
</html>
