<!DOCTYPE html>
<html lang="en">
<head>

    <title>transitions demo</title>
    <style>
        .button{
            background-color: rgb(71, 71, 214);
            color: white;;
            border: none;
            cursor: pointer;
            transition: background-colore 0.3s ease;
            padding: 10px 20px;
        }
        .button:hover{
            background-color: rgb(223, 116, 116) ;
        }
    </style>
</head>
<body>
    <div class="button">hover me</div>
</body>
</html>
