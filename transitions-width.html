<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>using transitions for width</title>
    <style>
        .box{
            background-color: rgb(221, 68, 68);
            color: white;
            padding: 25px 30px;
            width: 100px;
            height: 100px;
            transition: width 1.2sec ease;
            cursor: pointer;
        }
        .box:hover{
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="box">this is a box </div>
</body>
</html>
