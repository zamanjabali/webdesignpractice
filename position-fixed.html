<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>fixed position</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            height: 2000px;
        }
        .fixed-box{
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: bisque;
            color: black;
            padding: 10px 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="fixed-box">it is fixed</div>
    <h1>it will not move it is fixed</h1>
    <p>keep on scrolling it is fixed no matter what is stays there hehe</p>
</body>
</html>
