<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>using percentage unit</title>
    <style>
        .container{
            background-color: lightyellow;
            border: 1px black;
            padding: 2opx;
            width: 90%;
            margin: auto;
        }
        .box{
            background-color: rgba(61, 56, 56, 0.404);
            color: rgb(8, 8, 8);
            text-align: center;
            width: 50%;
            line-height: 100px;
            margin: 6px auto;
        }
        .textsmall{
            font-size: 70%;
            text-align: center;
        }
        .textlarge{
            font-size: 150%;
            text-align: center;
        }
        h2{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>using percentage in the page</h2>
        <div class="box">this box is 50% of width</div>
        <p class="textsmall">this is for small text</p>
         <p class="textlarge">this is for larger text</p>
    </div>
</body>
</html>
